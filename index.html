<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C++ 学习进度</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fc; --surface: #fff; --ink: #172033; --muted: #64748b; --line: #e2e8f0; --link: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --surface: #262626; --ink: #f5f5f5; --muted: #b8b8b8; --line: #484848; --link: #8ab4f8; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    main { max-width: 620px; margin: 10vh auto; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 24px; color: var(--muted); }
    nav { display: grid; gap: 14px; }
    .entry { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; }
    .entry:hover, .entry:focus-visible { border-color: var(--link); outline-color: var(--link); }
    .entry strong { display: block; font-size: 18px; color: var(--link); }
    .entry span { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }
    footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>C++ 学习进度</h1>

    <nav aria-label="选择学习页面">

      <a class="entry" href="templates/学习进度模板.html"><strong>打开学习进度模板</strong><span>完整功能与中文源码注释，方便复用到其他课程。</span></a>
    </nav>
    <footer>记录保存在当前浏览器中。<a href="https://github.com/Alexx-Powered/cpp-study-progress">查看源码与下载文件</a></footer>
  </main>
</body>
</html>
