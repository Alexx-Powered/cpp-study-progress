<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle"></title>
<script>
// Restore the preference before the first paint without touching study data.
const THEME_KEY = "cpp-study-theme-v1";
try {
 document.documentElement.dataset.theme = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
} catch (error) {
 document.documentElement.dataset.theme = "light";
}
</script>
<style>
:root{color-scheme:light;--blue:#2563eb;--green:#16a34a;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fc;--surface:#fff;--control-border:#cbd5e1;--track:#e5e7eb;--primary:#2563eb;--on-primary:#fff;--accent:#1d4ed8;--tab-bg:#e7efff;--tab-border:#bfdbfe;--danger:#b91c1c;--success:#166534;--secondary:#334155;--done-bg:#ecfdf5;--done-border:#bbf7d0;--bar:#3b82f6;--shadow:0 4px 18px #1e293b0b}
:root[data-theme="dark"]{color-scheme:dark;--blue:#8ab4f8;--green:#66dc91;--ink:#f5f5f5;--muted:#b8b8b8;--line:#484848;--bg:#111111;--surface:#262626;--control-border:#686868;--track:#414141;--accent:#ededed;--tab-bg:#363636;--tab-border:#858585;--danger:#ff9999;--success:#7be09e;--secondary:#dedede;--done-bg:#262626;--done-border:#484848;--bar:#76a9fa;--shadow:0 3px 10px #00000030}
:root{--study-label:#1d4ed8;--review-bar:#ef4444;--review-label:#b91c1c}
:root[data-theme="dark"]{--study-label:#8ab4f8;--review-bar:#f87171;--review-label:#fca5a5}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:1180px;height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;margin:0 auto;padding:18px 18px 0}
.dashboard{flex:0 0 auto;min-width:0;background:var(--bg);border-bottom:1px solid var(--line);padding-bottom:6px}
h1{margin:0 0 5px;font-size:25px;letter-spacing:.2px}.sub{color:var(--muted);font-size:12px}.sub a,a{color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
#vHours,#previewHours{font-size:clamp(16px,1.65vw,21px)}
.progress{height:9px;border-radius:99px;background:var(--track);overflow:hidden;margin:8px 0 12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#22c55e);transition:width .2s}
button,input,select{font:inherit;color:inherit}button,input:not([type=checkbox]),select{height:37px;max-width:100%;min-width:0;border:1px solid var(--control-border);border-radius:8px;background:var(--surface);padding:0 10px}
input::placeholder{color:var(--muted);opacity:1}
button{cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px}.theme-toggle{flex:0 0 auto;white-space:nowrap}
.tabs{display:flex;gap:7px;margin:0}.tabs button{border-color:transparent;background:transparent;color:var(--muted);font-weight:600}.tabs button[aria-selected=true]{background:var(--tab-bg);color:var(--accent);border-color:var(--tab-border)}
.entry-form{display:grid;grid-template-columns:180px minmax(0,1fr) auto auto;gap:9px;align-items:end}.field{display:flex;min-width:0;flex-direction:column;gap:3px}.field>span{font-size:12px;color:var(--muted)}.field input{width:100%}
.note{color:var(--muted);font-size:12px;margin:6px 0 3px}.preview{min-height:18px;font-size:12px;color:var(--accent);margin-top:5px}.preview.error{color:var(--danger)}
.message{font-size:12px;margin-top:5px;color:var(--success)}.message.error{color:var(--danger)}
.day-filter{display:flex;align-items:center;flex-wrap:wrap;gap:3px 12px;margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
.day-filter-toggle{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;height:27px;padding:0;border:0;background:transparent;font-size:12px}.day-filter .note{margin:0}.day-filter .note.error{color:var(--danger)}
.switch-track{display:block;position:relative;width:32px;height:18px;border:1px solid var(--control-border);border-radius:99px;background:var(--track)}.switch-track::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--on-primary)}
.day-filter-toggle[aria-checked=true] .switch-track{background:var(--primary);border-color:var(--primary)}.day-filter-toggle[aria-checked=true] .switch-track::after{transform:translateX(14px)}
#showReview[aria-checked=true] .switch-track{background:var(--review-bar);border-color:var(--review-bar)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1 1 180px}.position{font-weight:600;color:var(--secondary)}
.toolbar button:disabled{opacity:.5;cursor:not-allowed}
.panel{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 8px 24px 0;scrollbar-gutter:stable;overscroll-behavior:contain;scroll-padding:12px}
.panel:focus-visible{outline-offset:-2px}.list{display:grid;align-content:start;gap:8px}
.daily-summary{margin:0 0 10px;color:var(--muted);font-size:13px}.daily-records{display:grid;gap:9px}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;margin-bottom:14px;min-width:0}
.chart-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.chart-heading h2{font-size:16px;margin:0}.chart-heading span,.chart-note{font-size:11px;color:var(--muted)}.chart-note{margin:4px 0 8px}.chart-note:last-child{margin:6px 0 0}
.chart-legend{display:flex;gap:7px 18px;flex-wrap:wrap;margin:7px 0;font-size:12px}.chart-legend>span{display:inline-flex;align-items:center;gap:6px}.legend-swatch{width:10px;height:10px;border-radius:2px;background:var(--bar)}.legend-swatch.review{background:var(--review-bar)}
.chart-scroll{overflow:hidden;min-width:0;min-height:240px}.chart-scroll svg{display:block;max-width:100%}.chart-scroll .empty{border:0;min-height:240px;display:grid;place-items:center;padding:35px 14px}
.chart-hit{fill:transparent;pointer-events:all;cursor:crosshair}.chart-day:hover .chart-hit,.chart-day:focus-within .chart-hit{fill:var(--track);opacity:.35}.chart-detail{min-height:18px;color:var(--ink)}
.chart-axis{fill:var(--muted);font-size:11px}.chart-grid{stroke:var(--line);stroke-width:1}.chart-value,.review-value{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}.chart-value{fill:var(--study-label)}.review-value{fill:var(--review-label)}
.chart-value,.review-value{paint-order:stroke;stroke:var(--surface);stroke-width:2.5px;stroke-linejoin:round}
.study-bar,.study-bar-exit{fill:var(--bar);rx:2}.review-bar,.review-bar-exit{fill:var(--review-bar);rx:2}.study-bar-exit,.review-bar-exit{pointer-events:none}.study-bar:hover,.study-bar:focus,.review-bar:hover,.review-bar:focus{outline:none;stroke:var(--ink);stroke-width:2}
@media(prefers-reduced-motion:reduce){.progress>i{transition:none}}
.records-title{font-size:15px;margin:4px 0 9px}
.daily-record{display:grid;grid-template-columns:112px minmax(0,1fr) 64px 100px 112px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.daily-record time{font-weight:700}.record-episodes{min-width:0;overflow-wrap:anywhere}.record-count,.record-minutes{font-variant-numeric:tabular-nums}.record-actions{display:flex;gap:6px}.record-actions button{height:31px;padding:0 8px;font-size:12px}.record-caption{font-size:11px;color:var(--muted)}
.daily-record.unrecorded{border-style:dashed;color:var(--muted)}.chart-day-labels.unrecorded .chart-value{fill:var(--muted)}
.row{display:grid;grid-template-columns:24px 38px minmax(160px,1fr) 205px 82px 87px;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer}
.row.done{background:var(--done-bg);border-color:var(--done-border)}.row.current{border-color:var(--green);box-shadow:inset 3px 0 var(--green)}
.row .title{height:auto;max-width:100%;min-width:0;text-align:left;font-weight:600;padding:0;background:none;border:0;border-radius:2px}.row .title:hover{color:var(--blue)}
.row .stage{color:var(--muted);font-size:12px}.row .duration{font-variant-numeric:tabular-nums;color:var(--secondary);font-size:12px}.row .open{text-decoration:none;white-space:nowrap;font-size:12px}
.check{width:19px;height:19px;margin:0;accent-color:var(--green);cursor:pointer}.empty{text-align:center;padding:30px 18px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
/* Neutral surfaces separate regions; color is reserved for actions and progress. */
:root[data-theme="dark"] input:not([type=checkbox]),:root[data-theme="dark"] select{background:#181818}
:root[data-theme="dark"] .progress>i{background:var(--green)}
:root[data-theme="dark"] #vPct,:root[data-theme="dark"] #previewPct{color:var(--green)}
:root[data-theme="dark"] .row.done{box-shadow:inset 3px 0 var(--green)}
:root[data-theme="dark"] .row.current,:root[data-theme="dark"] .row:hover{background:#333333}
@media(max-width:900px){.row{grid-template-columns:24px 34px minmax(0,1fr) 80px}.row .stage{grid-column:3;grid-row:2}.row .open{grid-column:4;grid-row:2}.row .duration{grid-column:4;grid-row:1}.daily-record{grid-template-columns:104px minmax(0,1fr) 62px 90px}.record-actions{grid-column:2/-1;justify-content:flex-end}.entry-form{grid-template-columns:160px minmax(0,1fr) auto auto}.card{padding:10px}.value{font-size:22px}}
@media(max-width:600px){main{padding:12px 12px 0}h1{font-size:19px;line-height:1.35}.sub{font-size:11px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px 0 8px}.card{padding:8px}.label{font-size:11px}.value{font-size:20px}.progress{margin:7px 0 9px}.view-toolbar{margin-bottom:8px}.tabs button,.theme-toggle{height:34px;padding:0 8px;font-size:12px}.entry-form{grid-template-columns:140px minmax(0,1fr);gap:6px}.entry-form>button{width:100%}.field>span{font-size:11px}.entry-form input,.entry-form button,.toolbar input,.toolbar select,.toolbar button{height:33px;font-size:12px;padding:0 7px}.note{font-size:11px}.preview,.message{font-size:11px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.toolbar input{grid-column:1/-1}.toolbar #clearPosition{grid-column:1/-1}.toolbar>*{width:100%}.row{grid-template-columns:22px 29px minmax(0,1fr) 78px;gap:6px;padding:9px 8px}.row .title{overflow-wrap:anywhere;font-size:13px}.panel{padding-right:4px}.daily-record{grid-template-columns:1fr auto;gap:7px 10px;padding:11px}.record-episodes{grid-column:1/-1;grid-row:2}.record-count{grid-column:1;grid-row:3}.record-minutes{grid-column:2;grid-row:3;text-align:right}.record-actions{grid-column:2;grid-row:1}.daily-summary{font-size:12px}}
@media(max-height:650px){main{padding-top:7px}h1{font-size:17px;line-height:1.3}.sub{font-size:11px}.stats{gap:6px;margin:7px 0}.card{padding:5px 8px}.label{font-size:10px}.value{font-size:18px}#vHours,#previewHours{font-size:15px}.progress{height:6px;margin:5px 0 7px}.view-toolbar{margin-bottom:6px}.tabs button,.theme-toggle{height:28px;font-size:12px}.entry-form input,.entry-form button,.toolbar input,.toolbar select,.toolbar button{height:29px;font-size:12px}.field>span{font-size:10px}.entry-form{gap:6px}.note,.preview,.message{font-size:10px;margin-top:3px}.dashboard{padding-bottom:3px}}
@media(max-height:650px) and (min-width:601px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.entry-form{grid-template-columns:145px minmax(0,1fr) auto auto}}
@media(max-width:600px){.toolbar #clearPosition{grid-column:auto}}
</style>
</head>
<body><main>
<header class="dashboard">
<h1 id="heading"></h1><div class="sub" id="subtitle"></div>
<div class="view-toolbar">
<div class="tabs" role="tablist" aria-label="统计与预览功能切换">
 <button id="dailyTab" type="button" role="tab" aria-selected="true" aria-controls="dailyPanel">学习统计</button>
 <button id="browseTab" type="button" role="tab" aria-selected="false" aria-controls="list" tabindex="-1">分集预览</button>
</div>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到深色主题">切换深色</button>
</div>
<div class="message error" id="themeNotice" role="status" hidden></div>
<div id="dailyHeader">
<section class="stats" aria-label="手动记录统计">
 <div class="card"><div class="label">已学集数 / 总集数</div><div class="value" id="vDone"></div></div>
 <div class="card"><div class="label">完成比例（按时长）</div><div class="value" id="vPct"></div></div>
 <div class="card"><div class="label">已学分钟 / 总分钟</div><div class="value" id="vHours"></div></div>
 <div class="card"><div class="label">剩余集数</div><div class="value" id="vLeft"></div></div>
</section>
<div class="progress" role="progressbar" aria-label="手动记录的课程完成比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar"><i id="progressFill"></i></div>
<div id="dailyControls">
 <form class="entry-form" id="recordForm" novalidate>
  <label class="field"><span>学习日期</span><input id="recordDate" type="date" required></label>
  <label class="field"><span>学习分集（P1～P314）</span><input id="recordEpisodes" type="text" required autocomplete="off" placeholder="例如 1-10, 15" aria-describedby="entryPreview"></label>
  <button class="primary" id="saveRecord" type="submit">保存当天记录</button>
  <button id="clearForm" type="button">清空输入</button>
 </form>
 <div class="preview" id="entryPreview" aria-live="polite" hidden></div>
 <div class="day-filter">
  <button id="hideIdleDays" class="day-filter-toggle" type="button" role="switch" aria-checked="true" aria-label="过滤未学习日期" aria-controls="dailyChart dailyRecords" aria-describedby="dayFilterHint"><span class="switch-track" aria-hidden="true"></span><span>过滤未学习日期</span></button>
  <button id="showReview" class="day-filter-toggle" type="button" role="switch" aria-checked="true" aria-label="显示跨天复习" aria-controls="dailyChart" aria-describedby="reviewDisplayHint"><span class="switch-track" aria-hidden="true"></span><span>显示跨天复习</span></button>
  <span class="note" id="dayFilterHint" hidden></span>
 </div>
</div>
<div class="message" id="message" role="status" aria-live="polite" hidden></div>
</div>
<div id="browseControls" hidden>
 <section class="stats" id="previewStats" aria-label="学习量预览，不计入统计">
  <div class="card"><div class="label">累计集数 / 总集数</div><div class="value" id="previewDone"></div></div>
  <div class="card"><div class="label">完成比例（按时长）</div><div class="value" id="previewPct"></div></div>
  <div class="card"><div class="label">累计分钟 / 总分钟</div><div class="value" id="previewHours"></div></div>
  <div class="card"><div class="label">剩余集数</div><div class="value" id="previewLeft"></div></div>
 </section>
 <div class="progress" role="progressbar" aria-label="假设学完所选分集的课程完成比例预览" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="previewProgressBar"><i id="previewProgressFill"></i></div>
 <div class="toolbar">
  <input id="search" type="search" placeholder="搜索标题或分集编号" aria-label="搜索标题或分集编号">
  <select id="stage" aria-label="筛选阶段"></select>
  <select id="status" aria-label="筛选勾选状态"><option value="">全部勾选状态</option><option value="0">未勾选</option><option value="1">已勾选</option></select>
  <button id="jumpToPosition" type="button" aria-controls="list" disabled>跳转到当前进度</button>
  <button id="clearPosition" type="button">清空勾选位置</button>
 </div>
 <div class="note"><span class="position" id="positionLabel"></span> · 点选分集，预览从第 1 集学到此处的累计量；不计入统计。</div>
 <div class="message" id="browseMessage" role="status" aria-live="polite" hidden></div>
</div>
</header>
<section class="panel" id="dailyPanel" tabindex="0" role="tabpanel" aria-labelledby="dailyTab">
 <p class="daily-summary" id="dailySummary"></p>
 <section class="chart-card" aria-labelledby="chartTitle">
  <div class="chart-heading"><h2 id="chartTitle">每日学习量</h2><span>单位：分钟</span></div>
  <div class="chart-legend" aria-label="柱状图图例"><span><i class="legend-swatch" aria-hidden="true"></i>首次学习</span><span><i class="legend-swatch review" aria-hidden="true"></i><span id="reviewLegend">跨天复习</span></span></div>
  <p class="chart-note" id="reviewDisplayHint"></p>
  <div class="chart-scroll" id="dailyChart" tabindex="0" role="region" aria-label="每日学习分钟柱状图"></div>
  <p class="chart-note chart-detail" id="chartDetail" aria-live="polite">悬停或点击柱子查看详情。</p>
 </section>
 <h2 class="records-title">每日记录</h2><div class="daily-records" id="dailyRecords"></div>
</section>
<section class="panel list" id="list" tabindex="0" role="tabpanel" aria-labelledby="browseTab" hidden></section>
</main>

  $("recordEpisodes").value = formatEpisodes(episodes);
  editingDate = date;
  updatePreview();
 }
});
$("recordDate").addEventListener("change", () => {
 const existing = records.find(record => record.date === $("recordDate").value);
 if (existing) {
  $("recordEpisodes").value = formatEpisodes(existing.episodes);
  editingDate = existing.date;
 } else if (editingDate) {
  $("recordEpisodes").value = "";
  editingDate = null;
 }
 updatePreview();
});
$("recordEpisodes").addEventListener("input", updatePreview);
$("clearForm").addEventListener("click", () => { clearForm(); if (recordsReadable) showMessage(""); });
$("dailyRecords").addEventListener("click", event => {
 const button = event.target.closest("button[data-action]");
 if (!button) return;
 const date = button.closest(".daily-record").dataset.date;
 if (button.dataset.action === "add") {
  $("recordDate").value = date;
  $("recordEpisodes").value = "";
  editingDate = null;
  updatePreview();
  $("recordEpisodes").focus();
  return;
 }
 const record = records.find(item => item.date === date);
 if (!record) return;
 if (button.dataset.action === "edit") {
  $("recordDate").value = date;
  $("recordEpisodes").value = formatEpisodes(record.episodes);
  editingDate = date;
  updatePreview();
  $("recordEpisodes").focus();
 } else if (confirm("删除 " + date + " 的学习记录？")) {
  if (commitRecords(records.filter(item => item.date !== date), "已删除 " + date + " 的记录。") && $("recordDate").value === date) clearForm();
 }
});
$("list").addEventListener("click", event => {
 if (event.target.closest("a")) return;
 const row = event.target.closest(".row");
 if (row) setPosition(Number(row.dataset.episode));
});
$("clearPosition").addEventListener("click", () => setPosition(0));
$("jumpToPosition").addEventListener("click", jumpToPosition);
$("search").addEventListener("input", () => renderList(true));
$("stage").addEventListener("change", () => renderList(true));
$("status").addEventListener("change", () => renderList(true));
$("dailyTab").addEventListener("click", () => setTab("daily"));
$("browseTab").addEventListener("click", () => setTab("browse"));
for (const eventName of ["pointermove", "click", "focusin"]) {
 $("dailyChart").addEventListener(eventName, event => {
  const group = event.target.closest?.(".chart-day");
  if (!group || group.getAttribute("aria-hidden") === "true") return;
  const detail = group.querySelector(".chart-day-title").textContent;
  if ($("chartDetail").textContent !== detail) $("chartDetail").textContent = detail;
 });
}
$("hideIdleDays").addEventListener("click", () => {
 hideIdleDays = !hideIdleDays;
 renderDailyRecords(true);
 try {
  localStorage.setItem(IDLE_FILTER_KEY, String(hideIdleDays));
 } catch (error) {
  showMessage("无法保存筛选偏好，刷新后可能恢复。", true);
 }
});
$("showReview").addEventListener("click", () => {
 showReview = !showReview;
 // Display only: do not recalculate totals, rebuild records, or touch form drafts.
 renderDailyChart(true);
 try {
  localStorage.setItem(REVIEW_DISPLAY_KEY, String(showReview));
 } catch (error) {
  showMessage("无法保存复习显示偏好，刷新后可能恢复。", true);
 }
});
$("themeToggle").addEventListener("click", () => {
 const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
 applyTheme(theme);
 $("themeNotice").hidden = true;
 try {
  localStorage.setItem(THEME_KEY, theme);
 } catch (error) {
  $("themeNotice").textContent = "无法保存主题偏好，刷新后可能恢复。";
  $("themeNotice").hidden = false;
 }
});
document.querySelector(".tabs").addEventListener("keydown", event => {
 if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
 event.preventDefault();
 const daily = event.key === "Home" || (event.key !== "End" && event.target.id === "browseTab");
 setTab(daily ? "daily" : "browse");
 $(daily ? "dailyTab" : "browseTab").focus();
});
applyTheme(document.documentElement.dataset.theme);
setTab("daily");
loadRecords();
renderStatistics();
renderDailyRecords();
renderList();
updatePreview();
let chartViewportWidth = $("dailyChart").clientWidth;
new ResizeObserver(entries => {
 const width = entries[0].contentRect.width;
 if (width > 0 && width !== chartViewportWidth) {
  chartViewportWidth = width;
  renderDailyChart();
 }
}).observe($("dailyChart"));
chartReducedMotion.addEventListener("change", event => { if (event.matches) finishDailyChartAnimation(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) finishDailyChartAnimation(); });
</script></body></html>
