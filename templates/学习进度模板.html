<!doctype html>
<html lang="zh-CN">
<!--
学习进度单文件模板 · 注释版
整理日期：2026-10-07；参考：C++ 学习进度页面。

复用步骤：
1. 复制本文件，用 UTF-8 编码保存为新课程的 HTML，可直接用浏览器打开。
2. 修改下方 TEMPLATE_CONFIG：课程名称、来源链接、独立的 storagePrefix。
   每门课程或每份独立进度使用不同前缀；已开始记录后保持前缀稳定。
3. 修改【分集数据 BASE】：按实际播放顺序填写 title、duration、stage。
   数组第 1 项对应 P1；总集数、阶段筛选、总时长会自动计算。
   已有进度后若重排或替换课程分集，应为新版本换一个存储前缀。
4. 其他平台的分集链接，可修改 buildEpisodeUrl() 的链接规则。
5. 配色在【样式】中调整；动画时长与柱顶字号范围在配置区调整。

源码导航：
【配置】→【样式】→【页面结构】→【分集数据】→【状态与计算】
→【记录读取与统计】→【每日图表】→【表单与预览】→【事件与初始化】
【状态与计算】中的【完成烟花】仅在实际学习时长达到 100% 后循环播放。

数据约定：
- 每日记录：{ version: 1, records: [{ date: "YYYY-MM-DD", episodes: [1, 2] }] }。
- 预览位置：0 表示未选，n 表示前面的 P1～Pn 全部勾选。
- 课程完成进度按分集去重、按原始秒数计算；每日学习分钟包含跨天复习。
- 学习记录由浏览器 localStorage 保存，本文件内保留的是课程元数据。
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle"></title>
<script>
/*
【配置】复用模板时优先修改这里。
storagePrefix 决定各项浏览器存储键，复制成独立课程时需要换成唯一值。
legacyPositionKeys 留空表示从独立进度开始；仅迁移同一课程旧版时填写旧键。
字号单位为 px，保持 valueFontMin <= valueFontMax；动画时长单位为毫秒。
*/
const TEMPLATE_CONFIG = {
 storagePrefix: "learning-progress-template",
 title: "黑马程序员匠心之作｜C++教程从0到1入门编程",
 courseUrl: "https://www.bilibili.com/video/BV1et411b73Z/",
 courseLinkText: "B 站课程",
 legacyPositionKeys: [],
 chartTransitionMs: 420,
 valueFontMin: 9,
 valueFontMax: 12
};

// 首次绘制前恢复深浅主题，避免页面先亮后暗；存储不可用时采用浅色。
const THEME_KEY = TEMPLATE_CONFIG.storagePrefix + "-theme-v1";
try {
 document.documentElement.dataset.theme = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
} catch (error) {
 document.documentElement.dataset.theme = "light";
}
</script>
<style>

  --tab-bg:#e7efff;
  --tab-border:#bfdbfe;
  --danger:#b91c1c;
  --success:#166534;
  --secondary:#334155;
  --done-bg:#ecfdf5;
  --done-border:#bbf7d0;

  --shadow:0 4px 18px #1e293b0b

</div>

/*
【状态与计算】数据路径：
手动保存 → records → 课程去重统计 + 每日首次/复习分类 → 图表与明细。
点击预览 → position → 预览卡片与前缀勾选。
图表开关仅改变显示与偏好，不写入每日记录。
*/
const $ = id => document.getElementById(id);
// 每类状态单独保存；修改配置前缀即可为另一课程建立独立记录。
const LOG_KEY = TEMPLATE_CONFIG.storagePrefix + "-daily-records-v1";
const POSITION_KEY = TEMPLATE_CONFIG.storagePrefix + "-position-v1";
const IDLE_FILTER_KEY = TEMPLATE_CONFIG.storagePrefix + "-hide-idle-days-v1";
const REVIEW_DISPLAY_KEY = TEMPLATE_CONFIG.storagePrefix + "-show-review-v1";
const TITLE = TEMPLATE_CONFIG.title;
// durations[i] 是第 i + 1 集的秒数；统计使用整数秒，避免累计四舍五入误差。
const durations = BASE.map(x => x.duration.split(":").reduce((s, n) => s * 60 + Number(n), 0));
const totalSeconds = durations.reduce((sum, n) => sum + n, 0);
const minutes = seconds => (seconds / 60).toFixed(1) + " 分钟";
const sumSeconds = episodes => episodes.reduce((sum, n) => sum + durations[n - 1], 0);
// records 是实际保存的数据；editingDate 区分修改旧日期和录入新日期。
let records = [];
let recordsReadable = true;
let editingDate = null;
let hideIdleDays = true;
try { hideIdleDays = localStorage.getItem(IDLE_FILTER_KEY) !== "false"; } catch (error) { /* 存储不可用时仍可临时切换显示。 */ }
let showReview = true;
try { showReview = localStorage.getItem(REVIEW_DISPLAY_KEY) !== "false"; } catch (error) { /* 复习显示偏好读取失败时采用默认显示。 */ }
// 所有柱形/文字过渡共用一段动画；尊重系统“减少动态效果”设置。
const chartReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const CHART_TRANSITION_MS = TEMPLATE_CONFIG.chartTransitionMs;
let chartMotion = null;
let chartNeedsRender = false;

// 【完成烟花】只由实际统计的整数秒数触发；透明画布不拦截任何操作。
// 达到 100% 后循环发射，进度回落立即停止；后台暂停，返回或刷新后恢复。
// 粒子数及设备像素比设上限；系统要求减少动态效果时改为静态烟花。
const completionFireworks = (() => {
 const canvas = $("completionFireworks");
 const context = canvas.getContext("2d");
 const palettes = [
  ["#f59e0b", "#fbbf24", "#fb7185"],
  ["#38bdf8", "#818cf8", "#c084fc"],
  ["#2dd4bf", "#34d399", "#facc15"],
  ["#f472b6", "#fb7185", "#fdba74"]
 ];
 const rockets = [], sparks = [];
 let complete = false, frame = 0, width = 0, height = 0, ratio = 0;
 let lastTime = 0, nextLaunch = 0;
 const random = (min, max) => min + Math.random() * (max - min);

 function resize() {
  const nextRatio = Math.min(window.devicePixelRatio || 1, 2);
  if (width === window.innerWidth && height === window.innerHeight && ratio === nextRatio) return;
  width = window.innerWidth;
  height = window.innerHeight;
  ratio = nextRatio;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  context.lineCap = "round";
  rockets.length = sparks.length = 0;
  lastTime = nextLaunch = 0;
 }

 function stop() {
  if (frame) cancelAnimationFrame(frame);
  frame = lastTime = nextLaunch = 0;
  rockets.length = sparks.length = 0;
  context?.clearRect(0, 0, width, height);
  canvas.hidden = true;
 }

 function launch() {
  const startX = random(width * .16, width * .84);
  rockets.push({
   startX, endX: Math.max(width * .1, Math.min(width * .9, startX + random(-width * .12, width * .12))),
   endY: random(height * .13, height * .46),
   age: 0, duration: random(.75, 1.15),
   palette: palettes[Math.floor(Math.random() * palettes.length)]
  });
 }

 function burst(rocket) {
  const count = width < 600 ? 48 : 72;
  const speed = Math.min(width, height, 800) * .22;
  for (let i = 0; i < count && sparks.length < 360; i++) {
   const angle = Math.PI * 2 * i / count + random(-.035, .035);
   const velocity = speed * random(.45, 1);
   sparks.push({
    x: rocket.endX, y: rocket.endY,
    vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity,
    age: 0, life: random(1.35, 2),
    color: rocket.palette[i % rocket.palette.length], size: random(1.1, 2.1)
   });
  }
 }

 function drawStatic() {
  context.clearRect(0, 0, width, height);
  context.globalAlpha = .8;
  for (let n = 0; n < 3; n++) {
   const x = width * (.22 + n * .28), y = height * (.22 + (n % 2) * .12);
   const radius = Math.min(width, height) * .075;
   for (let i = 0; i < 20; i++) {
    const angle = Math.PI * 2 * i / 20;
    context.strokeStyle = palettes[n][i % 3];
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(x + Math.cos(angle) * radius * .35, y + Math.sin(angle) * radius * .35);
    context.lineTo(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
    context.stroke();
   }
  }
  context.globalAlpha = 1;
 }

 function tick(time) {
  frame = 0;
  if (!complete || document.hidden || chartReducedMotion.matches) { refresh(); return; }
  const delta = lastTime ? Math.min((time - lastTime) / 1000, .04) : 1 / 60;
  lastTime = time;
  context.clearRect(0, 0, width, height);
  if (time >= nextLaunch) {
   launch();
   nextLaunch = time + random(950, 1350);
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
   const rocket = rockets[i];
   rocket.age += delta;
   const progress = Math.min(1, rocket.age / rocket.duration);
   const eased = 1 - (1 - progress) * (1 - progress);
   const x = rocket.startX + (rocket.endX - rocket.startX) * progress;
   const y = height + 8 + (rocket.endY - height - 8) * eased;
   if (progress >= 1) { burst(rocket); rockets.splice(i, 1); continue; }
   context.globalAlpha = .9;
   context.strokeStyle = rocket.palette[0];
   context.lineWidth = 2;
   context.beginPath();
   context.moveTo(x, y + 18 * (1 - progress) + 3);
   context.lineTo(x, y);
   context.stroke();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
   const spark = sparks[i];
   spark.age += delta;
   if (spark.age >= spark.life) { sparks.splice(i, 1); continue; }
   const oldX = spark.x, oldY = spark.y;
   const drag = Math.exp(-delta * .65);
   spark.vx *= drag;
   spark.vy = spark.vy * drag + 42 * delta;
   spark.x += spark.vx * delta;
   spark.y += spark.vy * delta;
   context.globalAlpha = Math.pow(1 - spark.age / spark.life, 1.4);
   context.strokeStyle = context.fillStyle = spark.color;
   context.lineWidth = spark.size;
   context.beginPath();
   context.moveTo(oldX, oldY);
   context.lineTo(spark.x, spark.y);
   context.stroke();
   context.beginPath();
   context.arc(spark.x, spark.y, spark.size * .65, 0, Math.PI * 2);
   context.fill();
  }
  context.globalAlpha = 1;
  frame = requestAnimationFrame(tick);
 }

 function refresh() {
  if (!complete || !context || document.hidden) { stop(); return; }
  canvas.hidden = false;
  resize();
  if (chartReducedMotion.matches) {
   if (frame) cancelAnimationFrame(frame);
   frame = lastTime = nextLaunch = 0;
   rockets.length = sparks.length = 0;
   drawStatic();
  } else if (!frame) {
   lastTime = nextLaunch = 0;
   frame = requestAnimationFrame(tick);
  }
 }

 window.addEventListener("resize", () => { if (complete) refresh(); });
 document.addEventListener("visibilitychange", refresh);
 window.addEventListener("pagehide", stop);
 window.addEventListener("pageshow", refresh);
 chartReducedMotion.addEventListener("change", refresh);
 return { update(value) { complete = Boolean(value); refresh(); } };
})();

 document.documentElement.dataset.theme = theme;

 $("themeToggle").textContent = "切换" + next;
 $("themeToggle").setAttribute("aria-label", "切换到" + next + "主题");
 $("themeToggle").title = "当前为" + (theme === "dark" ? "深色" : "浅色") + "主题";
}

// 分别显示统计或预览的提示，空文字会隐藏提示区域。
function showMessage(text, error = false, scope = "daily") {
 const message = $(scope === "browse" ? "browseMessage" : "message");
 message.textContent = text;
 message.className = "message" + (error ? " error" : "");
 message.hidden = !text;
}

// 校验真实日历日期；UTC 往返比对可以排除 2 月 30 日等非法输入。
function validDate(value) {
 if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value.slice(0, 4) === "0000") return false;
 const date = new Date(value + "T00:00:00Z");
 return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value;
}

// 解析单集、范围、P 前缀及中英文分隔符；同一天重复填写的分集去重。
function parseEpisodes(value) {
 const text = value.trim().replace(/[，、；;]/g, ",").replace(/[～~—–至到]/g, "-")
  .replace(/\b[Pp]\s*(?=\d)/g, "").replace(/\s*-\s*/g, "-");
 if (!text) throw new Error("请填写当天学习的分集编号，例如 1-10, 15。");
 const tokens = text.split(/[,\s]+/).filter(Boolean);
 if (!tokens.length) throw new Error("请填写有效的分集编号。");
 const episodes = new Set();
 for (const token of tokens) {
  const match = /^(\d+)(?:-(\d+))?$/.exec(token);
  if (!match) throw new Error("无法识别“" + token + "”。请使用 1-10, 15 这样的格式。");
  const start = Number(match[1]), end = Number(match[2] || match[1]);
  if (start < 1 || end > BASE.length || start > end) {
   throw new Error("分集编号须在 1～" + BASE.length + " 之间，范围从小到大填写。");
  }
  for (let n = start; n <= end; n++) episodes.add(n);
 }
 return [...episodes].sort((a, b) => a - b);
}

// 把递增编号重新压缩为 1-3, 5 等可编辑格式。
function formatEpisodes(episodes) {
 const ranges = [];
 for (let i = 0; i < episodes.length; i++) {
  const start = episodes[i];
  let end = start;
  while (i + 1 < episodes.length && episodes[i + 1] === end + 1) end = episodes[++i];
  ranges.push(start === end ? String(start) : start + "-" + end);
 }
 return ranges.join(", ");
}

/*
【记录读取与统计】读取每日记录并校验版本、日期和分集范围。
格式损坏时禁用保存并保留原始存储，避免用空数据覆盖已有记录。
*/
function loadRecords() {
 try {
  const raw = localStorage.getItem(LOG_KEY);
  if (raw === null) return;
  const saved = JSON.parse(raw);
  if (saved?.version !== 1 || !Array.isArray(saved.records)) throw new Error("invalid records");
  const dates = new Set();
  const loaded = saved.records.map(record => {
   if (!record || !validDate(record.date) || dates.has(record.date) || !Array.isArray(record.episodes) || !record.episodes.length ||
    record.episodes.some(n => !Number.isInteger(n) || n < 1 || n > BASE.length)) throw new Error("invalid record");
   dates.add(record.date);
   return { date: record.date, episodes: [...new Set(record.episodes)].sort((a, b) => a - b) };
  });
  records = loaded.sort((a, b) => b.date.localeCompare(a.date));
 } catch (error) {
  recordsReadable = false;
  $("saveRecord").disabled = true;
  showMessage("记录读取失败，已暂停保存。原数据未修改，请检查浏览器存储设置。", true);
 }
}

// 读取独立的预览位置；旧版勾选迁移只使用配置中明确指定的旧键。
function loadPosition() {
 try {
  const raw = localStorage.getItem(POSITION_KEY);
  if (raw !== null) {
   const saved = JSON.parse(raw);
   if (Number.isInteger(saved) && saved >= 0 && saved <= BASE.length) return saved;
  }
 } catch (error) { /* 新格式不可用时继续尝试配置的旧键；未配置时从 0 开始。 */ }
 const readLegacy = key => {
  if (!key) return [];
  try { const value = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(value) ? value : []; }
  catch (error) { return []; }
 };
 const saved = readLegacy(TEMPLATE_CONFIG.legacyPositionKeys[0]);
 const old = readLegacy(TEMPLATE_CONFIG.legacyPositionKeys[1]);
 let last = 0;
 BASE.forEach((_, i) => { if (Boolean(saved[i]?.done ?? old[i]?.done)) last = i + 1; });
 return last;
}

let position = loadPosition();

// 课程完成量：先对所有日期的分集取并集，再按时长计算百分比；复习不重复增加完成量。
function renderStatistics() {
 if (!recordsReadable) {
  completionFireworks.update(false);
  $("vDone").textContent = "— / " + BASE.length;
  $("vPct").textContent = "—";
  $("vHours").textContent = "— / " + minutes(totalSeconds);
  $("vLeft").textContent = "—";
  $("progressBar").setAttribute("aria-valuetext", "每日记录读取失败，统计暂不可用");
  return;
 }
 const completed = [...new Set(records.flatMap(record => record.episodes))];
 const learned = sumSeconds(completed);
 const percent = totalSeconds > 0 ? learned / totalSeconds * 100 : 0;
 $("vDone").textContent = completed.length + " / " + BASE.length;
 $("vPct").textContent = percent.toFixed(1) + "%";
 $("vHours").textContent = (learned / 60).toFixed(1) + " / " + minutes(totalSeconds);
 $("vLeft").textContent = BASE.length - completed.length;
 $("progressFill").style.width = percent + "%";
 $("progressBar").setAttribute("aria-valuenow", percent.toFixed(1));
 // 用未四舍五入的秒数判定，避免 99.95% 显示为 100.0% 时提前庆祝。
 completionFireworks.update(totalSeconds > 0 && learned === totalSeconds);
}

// 预览累计量只取 durations[0..position)，搜索和阶段筛选不会改变这个口径。
function renderPreviewStatistics() {
 const learned = durations.slice(0, position).reduce((sum, seconds) => sum + seconds, 0);
 const percent = totalSeconds > 0 ? learned / totalSeconds * 100 : 0;
 $("previewDone").textContent = position + " / " + BASE.length;
 $("previewPct").textContent = percent.toFixed(1) + "%";
 $("previewHours").textContent = (learned / 60).toFixed(1) + " / " + minutes(totalSeconds);
 $("previewLeft").textContent = BASE.length - position;
 $("previewProgressFill").style.width = percent + "%";
 $("previewProgressBar").setAttribute("aria-valuenow", percent.toFixed(1));

/*

function getDailyDisplay() {

 const seen = new Set();

  let firstSeconds = 0, reviewSeconds = 0, firstCount = 0, reviewCount = 0;
  for (const episode of record.episodes) {
   if (seen.has(episode)) { reviewSeconds += durations[episode - 1]; reviewCount++; }

}

// 创建 SVG 命名空间元素，避免普通 HTML 元素无法绘制的问题。

/*

端点文字向图内收拢，首尾日期仍保留，以免文字被 SVG 边缘裁掉。
*/
function chartLabelIndexes(count, minimumGap, centerAt) {
 const indexes = [];
 for (let i = 0; i < count; i++) {
  if (!indexes.length || centerAt(i) - centerAt(indexes[indexes.length - 1]) >= minimumGap) indexes.push(i);

 const last = count - 1;

  while (indexes.length > 1 && centerAt(last) - centerAt(indexes[indexes.length - 1]) < minimumGap) indexes.pop();
  indexes.push(last);

}

 if (preview.hidden) {
  preview.textContent = "";
  return;
 }
 try {
  const episodes = parseEpisodes($("recordEpisodes").value);
  const unchanged = existing && episodes.length === existing.episodes.length && episodes.every((n, i) => n === existing.episodes[i]);
  preview.textContent = (unchanged ? "已保存 " + existing.date + " · " : "待保存 · ") + episodes.length + " 集 · " + minutes(sumSeconds(episodes)) + (!unchanged && existing ? "（将覆盖当天记录）" : "");
 } catch (error) {
  preview.className = "preview error";
  preview.textContent = error.message;
 }
}

// 清空表单及编辑状态，随后更新输入预览。
function clearForm() {
 $("recordForm").reset();
 editingDate = null;
 updatePreview();
}

// 写入成功后才替换内存状态并刷新统计；保存失败时保留原数据和输入。
function commitRecords(next, message) {
 if (!recordsReadable) return false;
 try {
  localStorage.setItem(LOG_KEY, JSON.stringify({ version: 1, records: next }));
 } catch (error) {
  showMessage("保存失败：浏览器存储不可用或已满。本次修改未保存，请保留输入后重试。", true);
  return false;
 }
 records = next;
 renderStatistics();
 renderDailyRecords(true);
 updatePreview();
 showMessage(message);
 return true;
}

// 当前链接规则适用于 B 站合集；其他平台在这里修改分集 URL 拼接方式。
function buildEpisodeUrl(n) {
 const url = new URL(TEMPLATE_CONFIG.courseUrl);
 url.searchParams.set("p", String(n));
 return url.href;
}

// 按搜索、阶段、勾选状态生成分集；保留滚动及焦点，勾选状态由 position 唯一决定。
function renderList(resetScroll = false) {
 const list = $("list"), previousScroll = list.scrollTop;
 const active = document.activeElement;
 const focusedEpisode = list.contains(active) ? active.closest(".row")?.dataset.episode : null;
 const focusedClass = active?.className === "check" ? ".check" : ".title";
 const query = $("search").value.trim().toLowerCase(), stage = $("stage").value, status = $("status").value;
 const fragment = document.createDocumentFragment();
 let count = 0;
 BASE.forEach((episode, i) => {
  const n = i + 1, checked = n <= position;
  if (query && !("p" + n + " " + episode.title).toLowerCase().includes(query)) return;
  if (stage && episode.stage !== stage) return;
  if (status && (status === "1" ? !checked : checked)) return;
  count++;
  const row = document.createElement("article");
  row.className = "row" + (checked ? " done" : "") + (n === position ? " current" : "");
  row.dataset.episode = n;
  const label = "预览至 P" + n;
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "check"; cb.checked = checked; cb.title = label; cb.setAttribute("aria-label", label);
  const no = document.createElement("b"); no.textContent = String(n).padStart(3, "0");
  const title = document.createElement("button"); title.type = "button"; title.className = "title"; title.textContent = episode.title; title.title = label;
  const badge = document.createElement("div"); badge.className = "stage"; badge.textContent = episode.stage;
  const duration = document.createElement("div"); duration.className = "duration"; duration.textContent = minutes(durations[i]);
  const open = document.createElement("a"); open.className = "open"; open.href = buildEpisodeUrl(n); open.target = "_blank"; open.rel = "noopener noreferrer"; open.textContent = "打开第 " + n + " 集";
  row.append(cb, no, title, badge, duration, open);
  fragment.append(row);
 });
 if (!count) {
  const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "没有匹配的分集"; fragment.append(empty);
 }
 list.replaceChildren(fragment);
 list.scrollTop = resetScroll ? 0 : previousScroll;
 if (focusedEpisode) list.querySelector('[data-episode="' + focusedEpisode + '"] ' + focusedClass)?.focus({ preventScroll: true });
 renderPreviewStatistics();
}

// 一个整数决定整个勾选前缀；重复点击已选分集也会重新截断后续勾选。
function setPosition(next) {
 try {
  localStorage.setItem(POSITION_KEY, JSON.stringify(next));
  position = next;
  showMessage("", false, "browse");
 } catch (error) {
  showMessage("预览位置保存失败，请检查浏览器存储设置。", true, "browse");
 }
 renderList();
}

// 将当前预览位置滚到列表中央；仅清除遮挡目标的筛选，并保留其他筛选。
function jumpToPosition() {
 const list = $("list");
 if (!position || list.hidden) return;
 let row = list.querySelector('[data-episode="' + position + '"]');
 if (!row) {
  // 仅解除遮挡当前分集的搜索/阶段/未勾选筛选，目标位置保持原值。
  const episode = BASE[position - 1];
  const query = $("search").value.trim().toLowerCase();
  if (query && !("p" + position + " " + episode.title).toLowerCase().includes(query)) $("search").value = "";
  if ($("stage").value && $("stage").value !== episode.stage) $("stage").value = "";
  if ($("status").value === "0") $("status").value = "";
  renderList();
  row = list.querySelector('[data-episode="' + position + '"]');
 }
 if (!row) return;
 row.querySelector(".title").focus({ preventScroll: true });
 const top = list.scrollTop + row.getBoundingClientRect().top - list.getBoundingClientRect().top - (list.clientHeight - row.offsetHeight) / 2;
 list.scrollTo({ top: Math.max(0, Math.min(top, list.scrollHeight - list.clientHeight)), behavior: chartReducedMotion.matches ? "instant" : "smooth" });
}

// 切换对应头部和滚动面板，保留表单草稿、预览位置与各面板滚动状态。
function setTab(name) {
 const daily = name === "daily";
 $("dailyHeader").hidden = !daily;
 $("dailyControls").hidden = !daily;
 $("browseControls").hidden = daily;
 $("dailyPanel").hidden = !daily;
 $("list").hidden = daily;
 if (!daily) finishDailyChartAnimation();
 else if (chartNeedsRender) renderDailyChart();
 $("pageTitle").textContent = TITLE + " · " + (daily ? "学习统计" : "分集预览");
 $("subtitleText").textContent = "共 " + BASE.length + " 集 · 数据仅存本浏览器 · ";
 for (const id of ["dailyTab", "browseTab"]) {
  const selected = (id === "dailyTab") === daily;
  $(id).setAttribute("aria-selected", String(selected));
  $(id).tabIndex = selected ? 0 : -1;
 }
}

/* 【事件与初始化】先绑定交互，最后读取记录并完成首次绘制。 */
$("heading").textContent = TITLE;
$("episodeRangeLabel").textContent = "学习分集（P1～P" + BASE.length + "）";
$("recordEpisodes").placeholder = BASE.length >= 15 ? "例如 1-10, 15" : BASE.length > 1 ? "例如 1-" + Math.min(10, BASE.length) : "例如 1";
const subtitleText = document.createElement("span"); subtitleText.id = "subtitleText"; $("subtitle").append(subtitleText);
const sourceLink = document.createElement("a"); sourceLink.href = TEMPLATE_CONFIG.courseUrl; sourceLink.target = "_blank"; sourceLink.rel = "noopener noreferrer"; sourceLink.textContent = TEMPLATE_CONFIG.courseLinkText; $("subtitle").append(sourceLink);
$("stage").append(new Option("全部阶段", ""));
for (const stage of new Set(BASE.map(episode => episode.stage))) $("stage").append(new Option(stage, stage));

// 每个日期只保存一条记录：选择已存在的日期会替换当天记录，而不是重复追加。
$("recordForm").addEventListener("submit", event => {
 event.preventDefault();
 const date = $("recordDate").value;
 if (!validDate(date)) { showMessage("请选择有效的学习日期。", true); $("recordDate").focus(); return; }
 let episodes;
 try { episodes = parseEpisodes($("recordEpisodes").value); }
 catch (error) { showMessage(error.message, true); $("recordEpisodes").focus(); return; }
 const next = [...records.filter(record => record.date !== date), { date, episodes }].sort((a, b) => b.date.localeCompare(a.date));
 if (commitRecords(next, "")) {
  $("recordEpisodes").value = formatEpisodes(episodes);
  editingDate = date;
  updatePreview();
 }
});
// 选择已有日期自动载入当天记录；从编辑状态切到新日期时清空旧输入。
$("recordDate").addEventListener("change", () => {
 const existing = records.find(record => record.date === $("recordDate").value);
 if (existing) {
  $("recordEpisodes").value = formatEpisodes(existing.episodes);
  editingDate = existing.date;
 } else if (editingDate) {
  $("recordEpisodes").value = "";
  editingDate = null;
 }
 updatePreview();
});
$("recordEpisodes").addEventListener("input", updatePreview);
$("clearForm").addEventListener("click", () => { clearForm(); if (recordsReadable) showMessage(""); });
// 事件委托：补记只填入日期，修改载入原分集，删除须用户确认后再保存。
$("dailyRecords").addEventListener("click", event => {
 const button = event.target.closest("button[data-action]");
 if (!button) return;
 const date = button.closest(".daily-record").dataset.date;
 if (button.dataset.action === "add") {
  $("recordDate").value = date;
  $("recordEpisodes").value = "";
  editingDate = null;
  updatePreview();
  $("recordEpisodes").focus();
  return;
 }
 const record = records.find(item => item.date === date);
 if (!record) return;
 if (button.dataset.action === "edit") {
  $("recordDate").value = date;
  $("recordEpisodes").value = formatEpisodes(record.episodes);
  editingDate = date;
  updatePreview();
  $("recordEpisodes").focus();
 } else if (confirm("删除 " + date + " 的学习记录？")) {
  if (commitRecords(records.filter(item => item.date !== date), "已删除 " + date + " 的记录。") && $("recordDate").value === date) clearForm();
 }
});
// 点击分集行或勾选框均选到此处；“打开分集”链接继续执行正常导航。
$("list").addEventListener("click", event => {
 if (event.target.closest("a")) return;
 const row = event.target.closest(".row");
 if (row) setPosition(Number(row.dataset.episode));
});
$("clearPosition").addEventListener("click", () => setPosition(0));
$("jumpToPosition").addEventListener("click", jumpToPosition);
$("search").addEventListener("input", () => renderList(true));
$("stage").addEventListener("change", () => renderList(true));
$("status").addEventListener("change", () => renderList(true));
$("dailyTab").addEventListener("click", () => setTab("daily"));
$("browseTab").addEventListener("click", () => setTab("browse"));
// 鼠标悬停、点击或键盘聚焦时，读取对应日期的完整详情。
for (const eventName of ["pointermove", "click", "focusin"]) {
 $("dailyChart").addEventListener(eventName, event => {
  const group = event.target.closest?.(".chart-day");
  if (!group || group.getAttribute("aria-hidden") === "true") return;
  const detail = group.querySelector(".chart-day-title").textContent;
  if ($("chartDetail").textContent !== detail) $("chartDetail").textContent = detail;
 });
}
// 两个显示开关只保存偏好，复用完整记录重新绘制图表。
$("hideIdleDays").addEventListener("click", () => {
 hideIdleDays = !hideIdleDays;
 renderDailyRecords(true);
 try {
  localStorage.setItem(IDLE_FILTER_KEY, String(hideIdleDays));
 } catch (error) {
  showMessage("无法保存筛选偏好，刷新后可能恢复。", true);
 }
});
$("showReview").addEventListener("click", () => {
 showReview = !showReview;
 // 只重绘图表，实际累计时长始终包含复习。
 renderDailyChart(true);
 try {
  localStorage.setItem(REVIEW_DISPLAY_KEY, String(showReview));
 } catch (error) {
  showMessage("无法保存复习显示偏好，刷新后可能恢复。", true);
 }
});
// 主题通过 CSS 变量即时切换；偏好保存失败仍允许本次切换。
$("themeToggle").addEventListener("click", () => {
 const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
 applyTheme(theme);
 $("themeNotice").hidden = true;
 try {
  localStorage.setItem(THEME_KEY, theme);
 } catch (error) {
  $("themeNotice").textContent = "无法保存主题偏好，刷新后可能恢复。";
  $("themeNotice").hidden = false;
 }
});
// 提供方向键、Home/End 的选项卡键盘操作。
document.querySelector(".tabs").addEventListener("keydown", event => {
 if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
 event.preventDefault();
 const daily = event.key === "Home" || (event.key !== "End" && event.target.id === "browseTab");
 setTab(daily ? "daily" : "browse");
 $(daily ? "dailyTab" : "browseTab").focus();
});
// 首次加载顺序：主题 → 面板 → 实际记录 → 统计/图表 → 独立预览。
applyTheme(document.documentElement.dataset.theme);
setTab("daily");
loadRecords();
renderStatistics();
renderDailyRecords();
renderList();
updatePreview();
// 容器宽度改变后重新排布；隐藏面板的零宽度不会触发错误缩放。
let chartViewportWidth = $("dailyChart").clientWidth;
new ResizeObserver(entries => {
 const width = entries[0].contentRect.width;
 if (width > 0 && width !== chartViewportWidth) {
  chartViewportWidth = width;
  renderDailyChart();
 }
}).observe($("dailyChart"));
// 页面不可见或启用“减少动态效果”时立即收尾，避免积压后台动画。
chartReducedMotion.addEventListener("change", event => { if (event.matches) finishDailyChartAnimation(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) finishDailyChartAnimation(); });
</script></body></html>
